<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Practice Arena – Ôn thi Quản trị nguồn nhân lực</title>
<style>
:root{--bg:#eef6ef;--dot:#d6e6d9;--card:#fff;--tx:#14301f;--mut:#5c7364;--bd:#cbdccf;--pri:#166534;--onp:#fff;--ac:#22a05a;--ok:#1f9d55;--okb:#e3f5ea;--no:#d64545;--nob:#fbe7e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a12;--dot:#16271c;--card:#15241a;--tx:#e4f1e8;--mut:#9bb5a4;--bd:#2a4033;--pri:#6fd39a;--onp:#0e1a12;--ac:#6fd39a;--ok:#4cc27f;--okb:#1a3a2a;--no:#ff7b7b;--nob:#3d2020}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1px) 0 0/22px 22px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px solid var(--pri);margin-bottom:20px}
.logo{display:flex;gap:12px;align-items:center}
.badge{background:var(--pri);color:var(--onp);font-weight:800;font-size:13px;letter-spacing:.5px;padding:6px 10px;border-radius:6px}
h1{margin:0;font-size:30px;line-height:1.1}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.pill{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 14px;font-size:13px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;margin-bottom:16px}
h2{margin:0 0 16px;font-size:15px;letter-spacing:1.2px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
button{font:inherit;color:var(--tx);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.ch,.tg,.nv{background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;text-align:left;transition:.15s}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-weight:600}
.ch small{font-size:12px;color:var(--mut);white-space:nowrap}
.ch.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card));box-shadow:0 0 0 1px var(--ac) inset}
.sl{display:flex;align-items:center;gap:14px}
.sl input{flex:1;accent-color:var(--pri);height:6px}
.sl b{font-size:24px;min-width:56px;text-align:right}
.sl span{color:var(--mut);font-size:14px;white-space:nowrap}
.tg{display:flex;justify-content:space-between;width:100%;margin-top:12px;font-weight:600}
.tg em{font-style:normal;font-size:13px;color:var(--mut)}
.tg.on{border-color:var(--ok)}.tg.on em{color:var(--ok);font-weight:700}
.go{width:100%;background:var(--pri);color:var(--onp);border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:700}
.go:hover{filter:brightness(1.12)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--mut)}
.nv{padding:8px 14px;text-align:center}
.nv.p{background:var(--pri);color:var(--onp);border-color:var(--pri);font-weight:600}
.prog{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--ac);transition:width .2s}
.timer{font-weight:800;font-size:18px;color:var(--ac);margin-bottom:10px}
.timer.low{color:var(--no)}
.q{font-weight:700;font-size:18px;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;margin-bottom:10px;padding:13px 14px;border-radius:10px;background:var(--bg);border:1.5px solid var(--bd);line-height:1.45}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-size:13px;background:var(--card)}
.opt:not(:disabled):hover{border-color:var(--ac)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--nob);border-color:var(--no)}.opt.no b{background:var(--no);border-color:var(--no);color:#fff}
.opt:disabled{opacity:1;cursor:default}
.res{font-weight:700;min-height:26px}.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.nav{display:flex;justify-content:space-between;gap:8px}
.end{text-align:center}.end .big{font-size:52px;font-weight:800;color:var(--ac)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
@media(max-width:520px){h1{font-size:24px}.box{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo"><span class="badge">QTNL</span><div><h1>HR Practice Arena</h1><div class="sub">Ngân hàng câu hỏi — Quản trị nguồn nhân lực (Chương 1–8)</div></div></div>
<span class="pill mono" id="tot"></span>
</header>
<div id="app"></div>
</div>
<script>
const D={"chapters":["Chương 1: QUẢN TRỊ NGUỒN NHÂN LỰC","Chương 2: PHÂN TÍCH CÔNG VIỆC","Chương 3: HOẠCH ĐỊNH NGUỒN NHÂN LỰC","Chương 4: TUYỂN MỘ VÀ LỰA CHỌN","Chương 5: ĐÀO TẠO VÀ PHÁT TRIỂN","Chương 6","Chương 7","Chương 8"],"qs":[{"c":0,"n":1,"q":"Đi sâu vào Quản trị nguồn nhân lực có thể hiểu Quản trị nguồn nhân lực là…","o":["Là tất cả các hoạt động của một tổ chức để thu hút, xây dựng, phát triển, sử dụng, đánh giá, bảo toàn và giữ gìn một lực lượng lao động phù hợp với yêu cầu công việc của tổ chức cả về mặt số lượng và chất lượng.","Việc tuyển mộ, tuyển chọn, duy trì, phát triển, sử dụng, động viên và cung cấp tiện nghi cho nhân lực thông qua tổ chức của nó.","Nghệ thuật lãnh đạo, nghệ thuật chỉ huy, nghệ thuật làm việc với con người.","Bao gồm việc hoạch định, tổ chức, chỉ huy và kiểm soát các hoạt động nhằm thu hút, sử dụng và phát triển con người để có thể đạt được các mục tiêu của tổ chức."],"a":1},{"c":0,"n":2,"q":"Đối tượng của quản trị nguồn nhân lực là:","o":["Người lao động trong tổ chức.","Chỉ bao gồm những người lãnh đạo cấp cao trong tổ chức.","Chỉ bao gồm những nhân viên cấp dưới.","Người lao động trong tổ chức và các vấn đề liên quan đến họ."],"a":3},{"c":0,"n":3,"q":"Thực chất quản trị nguồn nhân lực là:","o":["Là công việc quản lý con người trong phạm vi nội bộ một tổ chức.","Là sự đối xử của tổ chức đối với con người lao động.","Chịu trách nhiệm đưa con người vào tổ chức giúp cho họ thực hiện công việc, thù lao cho sức lao động của họ và giải quyết các vấn đề phát sinh.","Tất cả đều đúng"],"a":3},{"c":0,"n":4,"q":"Quản trị nguồn nhân lực đóng vai trò…trong việc thành lập các tổ chức tồn tại, phát triển trên thị trường.","o":["Chỉ đạo.","Trung tâm.","Thiết lập.","Không có đáp án nào đúng."],"a":1},{"c":0,"n":5,"q":"Sự tiến bộ của khoa học kỹ thuật cùng với sự phát triển của nền kinh tế buộc các nhà quản trị phải quan tâm hàng đầu đến vấn đề:","o":["Áp dụng tiến bộ khoa học kỹ thuật vào trong sản xuất, quản lý.","Tìm đúng người phù hợp để giao đúng việc, đúng cương vị.","Tuyển chọn, sắp xếp, đào tạo, điều động nhân sự trong tổ chức nhằm đạt hiệu quả tối ưu.","Không có đáp án nào đúng."],"a":2},{"c":0,"n":6,"q":"Do sự cạnh tranh ngày càng gay gắt trên thị trường nên các tổ chức muốn tồn tại và phát triển thì vấn đề quan tâm hàng đầu là:","o":["Áp dụng tiến bộ khoa học kỹ thuật vào trong sản xuất, quản lý.","Tìm đúng người phù hợp để giao đúng việc, đúng cương vị.","Tuyển chọn, sắp xếp, đào tạo, điều động nhân sự trong tổ chức nhằm đạt hiệu quả tối ưu.","Không có đáp án nào đúng."],"a":1},{"c":0,"n":7,"q":"Các chức năng của quản trị nguồn nhân lực bao gồm:","o":["Nhóm chức năng thu hút nguồn nhân lực.","Nhóm chức năng đào tạo và phát triển.","Nhóm chức năng duy trì nguồn nhân lực.","Cả 3 nhóm chức năng trên."],"a":3},{"c":0,"n":8,"q":"Nhóm chức năng nào chú trọng vấn đề đảm bảo có đủ số lượng nhân viên với các phẩm chất phù hợp với công việc?","o":["Nhóm chức năng thu hút nguồn nhân lực.","Nhóm chức năng đào tạo và phát triển.","Nhóm chức năng duy trì nguồn nhân lực.","Nhóm chức năng đảm đảm công việc."],"a":0},{"c":0,"n":9,"q":"Nhóm chức năng chú trọng nâng cao năng lực của nhân viên, đảm bảo cho nhân viên trong doanh nghiệp có các kỹ năng, trình độ nghề nghiệp cần thiết?","o":["Nhóm chức năng thu hút nguồn nhân lực.","Nhóm chức năng đào tạo và phát triển.","Nhóm chức năng duy trì nguồn nhân lực.","Cả 3 nhóm chức năng trên."],"a":1},{"c":0,"n":10,"q":"Đối với cơ hội thăng tiến, công nhân đòi hỏi nơi nhà quản trị, ngoại trừ:","o":["Được cấp trên nhận biết các thành tích quá khứ.","Cơ hội được có các chương trình đào tạo và phát triển.","Các quỹ phúc lợi hợp lý.","Cơ hội cải thiện cuộc sống."],"a":2},{"c":0,"n":11,"q":"Các hoạt động như phỏng vấn, trắc nghiệm trong quá trình tuyển dụng nhân viên thuộc chức năng nào của quản trị nhân lực?","o":["Nhóm chức năng thu hút nguồn nhân lực","Nhóm chức năng đào tạo và phát triển","Nhóm chức năng duy trì nguồn nhân lực","Nhóm chức năng về tuyển dụng nhân viên"],"a":0},{"c":0,"n":12,"q":"Kích thích, động viên nhân viên thuộc nhóm chức năng nào của quản trị nhân lực?","o":["Nhóm chức năng thu hút nguồn nhân lực","Nhóm chức năng đào tạo và phát triển","Nhóm chức năng duy trì nguồn nhân lực","Nhóm chức năng mối quan hệ lao động"],"a":2},{"c":0,"n":13,"q":"Triết lý Quản trị nguồn nhân lực là những…của người lãnh đạo cấp cao về cách thức quản lý con người trong tổ chức.","o":["Quyết định","Hành động","Tư tưởng, quan điểm","Nội quy, quy định"],"a":2},{"c":0,"n":14,"q":"Quan niệm về con người của các nhà tâm lý xã hội học ở các nước tư bản công nghiệp phát triển (Đại diện là Mayo) là:","o":["Con người muốn được cư xử như những con người.","Con người như một bộ phận trong cổ máy","Con người được coi như là một công cụ lao động","Con người có các tiềm năng cần được khai thác và làm cho phát triển."],"a":0},{"c":0,"n":15,"q":"Tương ứng với ba quan niệm về người lao động có 3 mô hình quản lý con người:","o":["Cổ điển, các tiềm năng con người, các quan hệ con người.","Cổ điển, các quan hệ con người, các tiềm năng con người","Các quan hệ con người, cổ điển, các tiềm năng con người","Các quan hệ con người, các tiềm năng con người, cổ điển"],"a":1},{"c":0,"n":16,"q":"Thuyết X nhìn nhận đánh giá về con người, ngoại trừ","o":["Con người về bản chất là không muốn làm việc.","Cái mà họ làm không quan trọng bằng cái mà họ kiếm được.","Con người muốn cảm thấy mình có ích và quan trọng.","Rất ít người muốn làm một công việc đòi hỏi tính sáng tạo, tự quản, sáng kiến hoặc tự kiểm tra."],"a":2},{"c":0,"n":17,"q":"Thuyết Y nhìn nhận, đánh giá về con người là","o":["Con người về bản chất là không muốn làm việc","Cái mà họ làm không quan trọng bằng cái mà họ kiếm được","Con người muốn cảm thấy mình có ích và quan trọng","Người lao động sung sướng là chìa khóa dẫn tới năng suất lao động cao"],"a":2},{"c":0,"n":18,"q":"Thuyết Z nhìn nhận, đánh giá về con người là","o":["Con người về bản chất là không muốn làm việc","Cái mà họ làm không quan trọng bằng cái mà họ kiếm được","Con người muốn cảm thấy mình có ích và quan trọng","Người lao động hạnh phúc là chìa khóa dẫn tới năng suất lao động cao."],"a":3},{"c":0,"n":19,"q":"Phương pháp quản lý con người theo thuyết X, ngoại trừ","o":["Người quản lý cần phải kiểm tra, giám sát chặt chẽ cấp dưới và người lao động.","Phải để cấp dưới thực hiện một số quyền tự chủ nhất định và tự kiểm soát cá nhân trong quá trình làm việc.","Con người muốn cảm thấy mình có ích và quan trọng","Người lao động hạnh phúc là chìa khóa dẫn tới năng suất lao động cao."],"a":1},{"c":0,"n":20,"q":"Phương pháp quản lý con người theo thuyết X là:","o":["Người quản lý quan tâm và lo lắng cho nhân viên của mình như cha mẹ lo lắng cho con cái.","Có quan hệ hiểu biết và thông cảm lẫn nhau giữa cấp trên và cấp dưới.","Phân chia công việc thành những phần nhỏ dễ làm, dễ thực hiện, lặp đi lặp lại nhiều lần các thao tác.","Phải để cấp dưới thực hiện một số quyền tự chủ nhất định và tự kiểm soát cá nhân trong quá trình làm việc."],"a":2},{"c":0,"n":21,"q":"Phương pháp quản lý con người theo thuyết Y là","o":["Người quản lý quan tâm và lo lắng cho nhân viên của mình như cha mẹ lo lắng cho con cái.","Tạo điều kiện để học hành, phân chia quyền lợi thích đáng, công bằng, thăng tiến cho cấp dưới khi đủ điều kiện.","Phân chia công việc thành những phần nhỏ dễ làm, dễ thực hiện, lặp đi lặp lại nhiều lần các thao tác.","Phải để cấp dưới thực hiện một số quyền tự chủ nhất định và tự kiểm soát cá nhân trong quá trình làm việc."],"a":3},{"c":0,"n":22,"q":"Phương pháp quản lý con người theo thuyết Z là:","o":["Người quản lý quan tâm và lo lắng cho nhân viên của mình như cha mẹ lo lắng cho con cái.","Có quan hệ hiểu biết và thông cảm lẫn nhau giữa cấp trên và cấp dưới.","Phân chia công việc thành những phần nhỏ dễ làm, dễ thực hiện, lạp đi lặp lại nhiều lần các thao tác.","Người quản lý cần phải kiểm tra, giám sát chặt chẽ cấp dưới và người lao động."],"a":0},{"c":0,"n":23,"q":"Cách thức tác động tới nhân viên của thuyết X, ngoại trừ","o":["Làm cho người lao động cảm thấy sợ hãi và lo lắng","Chấp nhận cả những việc nặng nhọc và vất vả, đơn giản miễn là họ được trả công xứng đáng và người chủ công bằng.","Tự nguyện, tự giác làm việc, tận dụng khai thác tiềm năng của mình.","Lạm dụng sức khỏe, tổn hại thể lực, thiếu tính sáng tạo."],"a":2},{"c":0,"n":24,"q":"Cách thức tác động tới nhân viên của thuyết Y","o":["Tự thấy mình có ích và quan trọng, có vai trò nhất định trong tập thể do đó họ càng có trách nhiệm.","Làm cho người lao động cảm thấy sợ hãi và lo lắng.","Chấp nhận cả những việc nặng nhọc và vất vả, đơn giản miễn là họ được trả công xứng đáng và người chủ công bằng.","Lạm dụng sức khỏe, tổn hại thể lực, thiếu tính sáng tạo."],"a":0},{"c":0,"n":25,"q":"Cách thức tác động tới nhân viên của thuyết Z?","o":["Tự thấy mình có ích và quan trọng, có vai trò nhất định trong tập thể do đó học càng có trách nhiệm","Tự nguyện, tự giác làm việc, tận dụng khai thác tiềm năng của mình.","Tin tưởng, trung thành và dồn hết tâm lực vào công việc","Cả A và B"],"a":2},{"c":0,"n":26,"q":"Yếu tố nào không phải cách thức tác động tới nhân viên của thuyết Z?","o":["Làm cho người lao động sợ hãi và lo lắng","Tin tưởng, trung thành và dồn hết tâm lực vào công việc","Đôi khi ỷ lại, thụ động và trông chờ","Cả A và C"],"a":0},{"c":0,"n":27,"q":"Nguyên tắc quản lý con người theo trường phái cổ điển, ngoại trừ","o":["Tiêu chuẩn hóa và thống nhất các thủ tục","Thiết lập trật tự và kỷ luật nghiêm ngặt trong sản xuất","Công bằng, không thiên vị, khước từ mọi đặc quyền đặc lợi","Phát triển tinh thần trách nhiệm, tự kiểm tra."],"a":3},{"c":0,"n":28,"q":"Trường phái cổ điển có những ưu điểm, ngoại trừ:","o":["Đưa ra sự phân tích khoa học, tỉ mỉ mọi công việc","Quan tâm đến những nhu cầu vật chất và tinh thần","Ấn định các mức lao động, các tiêu chuẩn thực hiện công việc.","Đưa ra cách trả công xứng đáng với kết quả công việc."],"a":1},{"c":0,"n":29,"q":"Trường phái cổ điển có những nhược điểm, ngoại trừ","o":["Không tin vào con người và đánh giá thấp con người","Đưa ra sự phân tích khoa học, tỉ mỉ mọi công việc","Kiểm tra, kiểm soát con người từng giây, từng phút","Buộc con người phải làm việc với cường độ cao, liên tục."],"a":1},{"c":0,"n":30,"q":"Nguyên tắc quản lý con người của trường phái tâm lý xã hội, ngoại trừ","o":["Tập trung quyền lực cao cấp nhất của doanh nghiệp","Phân bớt quyền lực và trách nhiệm cho cấp dưới","Đánh giá cao vai trò động viên của người quản lý, điều khiển","Phát triển tinh thần trách nhiệm, tự kiểm tra."],"a":0},{"c":0,"n":31,"q":"Nguyên tắc quản lý con người của trường phái hiện đại, ngoại trừ:","o":["Phát triển các hình thức mới về tổ chức lao động","Đào tạo các nhà tâm lý lao động","Quản lý cần mềm dẻo, uyển chuyển.","Bàn bạc, thuyết phục, thương lượng với con người."],"a":1},{"c":0,"n":32,"q":"“Không thừa nhận có nhiều kênh, nhiều tuyến cùng chỉ huy, cùng ra lệnh trong sản xuất vì sẽ rối, sẽ chồng chéo, có khi còn cạnh tranh lẫn nhau (về quyền lực, về uy tín)” nằm trong nguyên tắc quản lý con người nào của trường phái cổ điển?","o":["Tập trung quyền lực","Thống nhất chỉ huy và điều khiển","Tiêu chuẩn hóa và thống nhất các thủ tục","Phân tích hợp lý, khoa học mọi công việc"],"a":1},{"c":0,"n":33,"q":"Con người như là “một hệ thống mở, phức tạp và độc lập” là quan điểm của trường phái nào?","o":["Trường phái cổ điển (tổ chức lao động khoa học)","Trường phái tâm lý xã hội (trường phái các mối quan hệ con người)","Trường phái QTNNL hiện đại (trường phái nguồn nhân lực)","Không thuộc trường phái nào."],"a":2},{"c":0,"n":34,"q":"Khi hoạch định chính sách quản lý con người cần quan tâm đến những điều gì?","o":["Tôn trọng và quý mến người lao động.","Tạo ra những điều kiện để con người làm việc có năng suất lao động cao, đảm bảo yêu cầu của doanh nghiệp.","Làm cho con người ngày càng có giá trị trong xã hội.","Cả A,B và C."],"a":3},{"c":0,"n":35,"q":"Môi trường bên ngoài của Quản trị nguồn nhân lực bao gồm, ngoại trừ:","o":["Khách hàng","Đối thủ cạnh tranh","Sứ mạng của tổ chức","Pháp luật"],"a":2},{"c":0,"n":36,"q":"Môi trường bên trong Quản trị nguồn nhân lực bao gồm, ngoại trừ:","o":["Mục tiêu của tổ chức","Khách hàng","Cơ cấu tổ chức","Bầu không khí tâm lý xã hội"],"a":1},{"c":0,"n":37,"q":"Trách nhiệm quản trị nguồn nhân lực trước hết thuộc về ai?","o":["Trưởng phòng quản trị nguồn nhân lực","Giám đốc doanh nghiệp","Những người quản lý và lãnh đạo các cấp, các bộ phận trong doanh nghiệp","Toàn thể lực lượng lao động trong doanh nghiệp"],"a":2},{"c":0,"n":38,"q":"Trong tổ chức, thường có những quyền hạn nào?","o":["Trực tuyến","Tham mưu","Chức năng","Cả 3 quyền hạn trên"],"a":3},{"c":0,"n":39,"q":"Quy mô và cơ cấu của bộ phận nguồn nhân lực của một tổ chức phụ thuộc vào yếu tố nào?","o":["Quy định pháp luật của Nhà nước","Trình độ nhân lực và quản lý nhân lực","Đặc điểm của công việc","Cả 3 đáp án trên"],"a":3},{"c":0,"n":40,"q":"Yêu cầu chủ yếu khi thành lập bộ phận nguồn nhân lực là:","o":["Cân đối","Linh hoạt","Kịp thời","Cả A và B"],"a":3},{"c":0,"n":41,"q":"Ở các doanh nghiệp Việt Nam, tên gọi của bộ phận nguồn nhân lực là:","o":["Tổ chức lao động","Tổ chức cán bộ","Lao động - Tiền lương","Cả 3 đáp án trên"],"a":3},{"c":0,"n":42,"q":"Ở các doanh nghiệp Việt Nam, tên gọi của bộ phận nguồn nhân lực khi sáp nhập với chức năng quản trị hành chính là?","o":["Tổ chức - hành chính","Hành chính tổng hợp","Tổ chức cán bộ - hành chính","Cả A và B"],"a":3},{"c":0,"n":43,"q":"Đối với công việc và điều kiện làm việc, công nhân viên đòi hỏi nơi nhà quản trị, ngoại trừ:","o":["Một việc làm an toàn","Giờ làm việc hợp lý","Được cảm thấy mình quan trọng và cần thiết","Việc tuyển dụng ổn định"],"a":2},{"c":0,"n":44,"q":"Yêu cầu cân đối của bộ phận nguồn nhân lực tức là?","o":["Số người thực hiện, cơ sở vật chất, tiền vốn được phân bố trong tương quan với khối lượng công việc phải thực hiện và sự đóng góp vào các mục tiêu của tổ chức cũng như trong tương quan với các bộ phận chức năng khác.","Số người thực hiện tùy thuộc vào yêu cầu của các bộ phận trong tổ chức","Số người thực hiện phải tương ứng với số năm hoạt động của tổ chức.","Không có đáp án nào đúng."],"a":0},{"c":0,"n":45,"q":"Đối với công việc và điều kiện làm việc, công nhân viên đòi hỏi nơi nhà quản trị, ngoại trừ","o":["Một bối cảnh làm việc hợp lý","Các quỹ phúc lợi hợp lý","Các cơ sở vật chất thích hợp","Việc tuyển dụng ổn định"],"a":1},{"c":0,"n":46,"q":"Đối với các quyền lợi cá nhân và lương bổng, công nhân đòi hỏi gì nơi nhà quản trị, ngoại trừ:","o":["Được đối xử theo cách tôn trọng phẩm giá con người","Được cấp trên lắng nghe","Cơ hội được học hỏi các kỹ năng mới","Không có vấn đề đặc quyền đặc lợi và địa vị"],"a":2},{"c":0,"n":47,"q":"Đối với các quyền lợi cá nhân và lương bổng, công nhân đòi hỏi gì nơi nhà quản trị, ngoại trừ:","o":["Được trả lương theo mức đóng góp của mình cho công ty","Đước cấp trên lắng nghe","Được quyền tham dự vào các quyết định ảnh hưởng trực tiếp đến mình","Một khung cảnh làm việc hợp lý"],"a":3},{"c":0,"n":48,"q":"Đối với cơ hội thăng tiến, công nhân đòi hỏi nơi nhà quản trị, ngoại trừ:","o":["Giờ làm việc hợp lý","Cơ hội cải thiện cuộc sống","Một công việc có tương lai","Cơ hội được học hỏi các kỹ năng mới"],"a":0},{"c":0,"n":49,"q":"Các chính sách, chương trình và thực tiễn quản trị cần được thiết lập và thực hiện sao cho có thể thỏa mãn cả nhu cầu vật chất lẫn tinh thần của nhân viên là tư tưởng của trường phái quản trị nào?","o":["Phong trào quản trị trên cơ sở khoa học","Phong trào các mối quan hệ con người","Quản trị nguồn nhân lực","Không có câu nào đúng"],"a":2},{"c":0,"n":50,"q":"Triết lý quản trị nguồn nhân lực liên quan đến yếu tố nào sau đây?","o":["Con người là vốn quý, nguồn nhân lực cần được đầu tư và phát triển","Quan tâm đến cả lợi ích của tổ chức lẫn lợi ích của nhân viên","Lao động là yếu tố chi phí đầu vào","Câu A và B đúng"],"a":3},{"c":0,"n":51,"q":"Yếu tố nào sau đây là thách thức đối với quản trị nguồn nhân lực hiện nay?","o":["Thách thức từ môi trường bên ngoài, liên quan đến sự thay đổi nhanh chóng của môi trường kinh doanh","Internet tạo nhiều cơ hội trong giao lưu, tiếp xúc; mở rộng phạm vi nội dung công việc, phá bỏ các hàng rào ngăn cản đối với thị trường lao động truyền thống.","Công nghệ thông tin đã làm thay đổi cách thức tiến hành kinh doanh, đặt ra yêu cầu cao hơn đối với lao động; đồng thời buộc các tổ chức thay đổi cách thức tổ chức và vận hành hoạt động kinh doanh.","Tất cả các yếu tố trên"],"a":3},{"c":0,"n":52,"q":"Khi chuyển sang nền kinh tế thị trường, phần lớn các doanh nghiệp Việt Nam cần khắc phục những nhược điểm chủ yếu nào trong hoạt động quản trị nguồn nhân lực","o":["Nhận thức chưa đúng của nhiều cán bộ quản lý, nhân viên đối với vai trò then chốt của hoạt động quản trị nguồn nhân lực đối với sự thành công của doanh nghiệp.","Đời sống kinh tế khó khăn, thu nhập thấp ảnh hưởng sâu sắc đến sức khỏe, sự nhiệt tình và hiệu quả thực hiện công việc.","Tác phong và kỷ luật công nghiệp chưa phù hợp","Tất cả các câu đều đúng"],"a":3},{"c":0,"n":53,"q":"Những thách thức nào sau đây thuộc về những vấn đề nội bộ của doanh nghiệp liên quan đến hoạt động quản trị nguồn nhân lực của mình:","o":["Thiếu lao động lành nghề đã gây ra khó khăn lớn cho doanh nghiệp trong việc tuyển nhân viên","Luật pháp về an toàn, điều kiện lao động, quan hệ lao động,…đã buộc các doanh nghiệp phải ngày càng quan tâm đến quyền lợi của nhân viên.","Thực hiện các biện pháp nâng cao quyền và trách nhiệm cho cấp dưới phân quyền và tổ chức nhóm tự quản.","Phương thức làm việc từ xa trở nên phổ biến gây ra áp lực lớn trong việc thu hút, duy trì nhân viên giỏi."],"a":2},{"c":0,"n":54,"q":"Để quản trị nguồn nhân lực có thể ứng phó với những thách thức từ môi trường kinh doanh các chức năng quản trị nguồn nhân lực nên được ưu tiên phát triển trong các lĩnh vực nào sau đây?","o":["Áp dụng các thành tựu của cách mạng thông tin vào trong các hoạt động quản trị nguồn nhân lực","Phát triển chiến lược nguồn nhân lực trở thành một bộ phận quan trọng trong chiến lược của tổ chức","Xây dựng môi trường văn hóa phù hợp với yêu cầu, mục tiêu của tổ chức.","Tất cả các nội dung trên"],"a":3},{"c":0,"n":55,"q":"Phòng quản trị nguồn nhân lực trong doanh nghiệp phải thực hiện những chức năng nào sau đây?","o":["Thực hiện hoặc phối hợp với các phòng ban khác cùng thực hiện các chức năng quản trị nguồn nhân lực","Xây dựng chiến lược phát triển cho công ty","Kiểm tra, giám sát tình hình thực hiện các chức năng quản trị nguồn nhân lực trong toàn tổ chức","Câu A và câu C đúng"],"a":3},{"c":0,"n":56,"q":"Cán bộ phòng quản trị nguồn nhân lực thường phải giúp các lãnh đạo trực tuyến giải quyết những vấn đề khó khăn nào sau đây?","o":["Làm thế nào để khuyến khích nhân viên nâng cao lòng trung thành, gắn bó với doanh nghiệp","Làm thế nào để tạo ra một môi trường văn hóa phù hợp với chiến lược kinh doanh của doanh nghiệp","Tìm hiểu quan điểm, thái độ của nhân viên đối với một số chính sách mới dự định áp dụng vào doanh nghiệp","Tất cả các đáp án trên"],"a":3},{"c":0,"n":57,"q":"Về phương diện nghiệp vụ, phòng quản trị nguồn nhân lực thực hiện các chức năng nào sau đây?","o":["Thu hút, tuyển dụng","Đánh giá kết quả làm việc của nhân viên","Cố vấn, hướng dẫn cho các lãnh đạo trực tuyến về kỹ năng và cách thức thực hiện các chức năng quản trị nguồn nhân lực","Câu A và câu B đúng"],"a":3},{"c":0,"n":58,"q":"Về phương diện hệ thống, phòng quản trị nguồn nhân lực thực hiện các chức năng nào sau đây?","o":["Đào tạo và phát triển nguồn nhân lực","Quản trị hệ thống trả công lao động","Quan hệ lao động","Thực hiện hoặc phối hợp với các phòng ban khác cùng thực hiện các chức năng quản trị nguồn nhân lực."],"a":3},{"c":0,"n":59,"q":"Với tư cách là 1 trong những chức năng cơ bản của quản trị tổ chức thì quản trị nguồn nhân lực là…","o":["Tất cả các hoạt động của một tổ chức để thu hút, xây dựng, phát triển, sử dụng, đánh giá, bảo toàn và giữ gìn một lực lượng lao động phù hợp với yêu cầu công việc của tổ chức cả về mặt số lượng và chất lượng.","Việ n đề theo kiểu mới","Thay đổi quy trình thực hiện","Sử dụng phương pháp tương tác mới","Tất cả các lựa chọn đều đúng"],"a":3},{"c":1,"n":51,"q":"Làm việc từ xa (telework) là lựa chọn cấp thiết trong hoàn cảnh nào?","o":["Công việc đòi hỏi phải thực hiện các thao tác đa dạng","Dịch bệnh hoặc thời tiết xấu","Khi công việc được thiết kế theo kiểu mở rộng công việc","Khi công việc được chuyên môn hóa"],"a":1},{"c":1,"n":52,"q":"Làm việc từ xa (telework) được hiểu là:","o":["Sắp xếp ca làm việc với những khoảng thời gian linh động trong ngày","Một công việc được chia sẻ với nhiều nhân viên","Nhân viên làm việc thông qua các thiết bị điện tử, viễn thông và internet","Di chuyển đến làm việc ở những nơi khác nhau"],"a":2},{"c":1,"n":53,"q":"Năng lực (Competency) được hiểu là:","o":["Khả năng của cá nhân để thực hiện công việc hoặc đóng góp vào nhóm","Trách nhiệm buộc phải thực hiện một số nhiệm vụ","Các nhiệm vụ chuyên biệt cần phải thực hiện","Là hoàn cảnh, thông tin cần thiết cho công việc"],"a":0},{"c":1,"n":54,"q":"Thiết kế Tuần làm việc rút ngắn (Compressed workweek) thường có đặc điểm:","o":["Thời gian làm việc/ngày giảm, số ngày làm việc/tuần tăng","Thời gian làm việc/ngày tăng, số ngày làm việc/tuần tăng","Thời gian làm việc/ngày tăng, số ngày làm việc/tuần giảm","Thời gian làm việc/ngày giảm, số ngày làm việc/tuần giảm"],"a":2},{"c":1,"n":55,"q":"Thiết kế làm việc theo ca (Shift Work) phù hợp với loại tổ chức nào?","o":["Có phương tiện điện tử, viễn thông hiện đại","Hoạt động cả ngày","Có nhiều người mệt mỏi, không thích làm việc","Phân bố rộng với nhiều chi nhánh"],"a":1},{"c":1,"n":56,"q":"Phương pháp phân tích công việc nào sau đây giúp tiết kiệm thời gian nhiều nhất","o":["Sử dụng bảng hỏi","Quan sát","Phỏng vấn trực tiếp","Hệ thống phân tích công việc trên máy tính và web"],"a":3},{"c":1,"n":57,"q":"Phương pháp nào sau đây có thể dùng để phân tích công việc?","o":["Sử dụng bảng hỏi","Quan sát","Phỏng vấn trực tiếp","Tất cả các lựa chọn đều đúng"],"a":3},{"c":1,"n":58,"q":"Cách phân tích công việc nào sau đây phụ thuộc nhiều nhất vào các ghi chép theo dõi công việc hàng ngày từ chính nhân viên","o":["Nhật ký công việc","Phỏng vấn trực tiếp","Hệ thống phân tích công việc trên máy tính","Sử dụng bảng hỏi phân tích vị trí công việc"],"a":0},{"c":1,"n":59,"q":"Khi phân tích công việc, đặc điểm của các Bảng hỏi phân tích vị trí công việc (Position Analysis Questionnaire - PQA) là:","o":["Người quản lý quan sát và ghi chép công việc của nhân viên","Nhân viên hoàn thành các thông tin được thiết kế sẵn về công việc","Người quản lý phỏng vấn nhân viên","Nhân viên tự ghi chép công việc hàng ngày của mình"],"a":1},{"c":1,"n":60,"q":"Khi phân tích công việc, đặc điểm của phương pháp Lấy mẫu công việc (Work Sampling) là:","o":["Chú trọng tất cả các chi tiết công việc","Chú trọng toàn bộ quá trình làm việc của tất cả nhân viên","Chú trọng những chi tiết ít xuất hiện trong công việc","Chú trọng những thao tác tiêu biểu trong công việc"],"a":3},{"c":2,"n":1,"q":"Hoạch định nguồn nhân lực là quá trình phân tích,…và…của nguồn nhân lực để tổ chức có thể đáp ứng các mục tiêu của hoạt động sản xuất - kinh doanh","o":["Xác định nhu cầu và số lượng","Xác định nhu cầu và khả năng","Tìm kiếm và đánh giá","Tuyển dụng và đào tạo"],"a":1},{"c":2,"n":2,"q":"Hoạch định nguồn nhân lực là một tiến trình xét duyệt lại một cách có hệ thống những…về tài nguyên nhân sự để đảm bảo rằng tổ chức sẽ có…có đầy đủ kỹ năng theo đúng nhu cầu.","o":["...yêu cầu…đúng số người…","…mục tiêu…đúng chất lượng…","…yêu cầu…đúng chất lượng","…mục tiêu…đúng số người"],"a":0},{"c":2,"n":3,"q":"Hoạch định chiến lược là quá trình xác định…của tổ chức và những…cần thiết để đạt được những mục tiêu đó.","o":["…mục tiêu…hành động…","…mục tiêu…kế hoạch…","…yêu cầu…hành động…","…yêu cầu…kế hoạch…"],"a":0},{"c":2,"n":4,"q":"“Hoạch định là quá trình tiên liệu hay dự báo những thay đổi cũng như phòng ngừa các rủi ro trong tương lai”. Có 4 khái niệm liên quan đến vấn đề dự báo. Khái niệm  đào tạo hiểu rõ hơn về cách thức làm việc.","Quy trình giúp người được đào tạo hiểu rõ hơn về quy trình thực hiện các công việc, các yêu cầu đạt được cũng như những sai sót cần tránh","Tất cả đều đúng"],"a":3},{"c":4,"n":13,"q":"Trong số các hình thức đào tạo sau, hình thức nào sử dụng phương pháp đào tạo liên quan đến việc giảng viên giao tiếp với học viên?","o":["Đào tạo chéo (Cross-training)","Đào tạo tại chỗ (on-the-job training)","Thực hành chủ động (active practice)","Lớp học (lecture)"],"a":3},{"c":4,"n":14,"q":"Loại kỹ năng nào sau đây khó đo lường và thường được đánh giá một cách chủ quan?","o":["Kỹ năng cứng (hard skills)","Kỹ năng mềm (soft skills)","Kỹ năng giao tiếp (communication skills)","Kỹ năng thuyết trình (presentation skills)"],"a":1},{"c":4,"n":15,"q":"Loại kỹ năng nào sau đây dễ đo lường và thường được đánh giá một cách khách quan?","o":["Kỹ năng cứng (hard skills)","Kỹ năng mềm (soft skills)","Kỹ năng giao tiếp (communication skills)","Kỹ năng thuyết trình (presentation skills)"],"a":0},{"c":4,"n":16,"q":"Các nguồn thông tin nào thường được sử dụng để phân tích nhu cầu đào tạo?","o":["Phân tích về tổ chức","Phân tích về công việc/ nhiệm vụ","Phân tích về cá nhân/ con người","Tất cả đều đúng"],"a":3},{"c":4,"n":17,"q":"Việc phân tích nhu cầu đào tạo hiệu quả giúp mang lại kết quả gì","o":["Phân tích chính xác hiệu suất công việc","Hoàn thành công việc xuất sắc","Xác định các mục tiêu đào tạo cụ thể có thể đo lường được","Tất cả đều đúng"],"a":2},{"c":4,"n":18,"q":"Một quy trình có cấu trúc trong đó các cá nhân trở thành nhân viên lành nghề thông qua sự kết hợp của việc được hướng dẫn trên lớp và đào tạo tại chỗ gọi là:","o":["Đào tạo trên máy tính","Đào tạo học việc (apprenticeship training)","Đào tạo phân công đặc biệt","Tất cả đều sai"],"a":1},{"c":4,"n":19,"q":"Ngày nay, nhiều nhà tuyển dụng cũng đang tận dụng lợi thế của việc đào tạo để cải thiện yếu tố nào?","o":["Sự cam kết của nhân viên","Sự vắng mặt của nhân viên","Sự luân chuyển lao đ nh giá việc đào tạo","Tham gia chương trình định hướng"],"a":3},{"c":4,"n":26,"q":"Bước đầu tiên trong một chương trình đào tạo là xác định:","o":["Nhu cầu đào tạo","Số lượng học viên","Đánh giá đào tạo","Phương pháp đào tạo"],"a":0},{"c":4,"n":27,"q":"Phát triển là sự đào tạo có bản chất…","o":["Ngắn hạn","Dài hạn","Kỹ thuật","Khoa học"],"a":1},{"c":4,"n":28,"q":"Trong nền kinh tế dựa trên dịch vụ ngày nay, tài sản quan trọng nhất của một công ty thường là:","o":["Máy móc","Những người lao động có kiến thức và kỹ năng cao","Mặt bằng văn phòng","Tiền mặt"],"a":1},{"c":4,"n":29,"q":"Để giảm nguy cơ bị truy cứu trách nhiệm đào tạo cẩu thả, bên sử dụng lao động nên:","o":["Chấp nhận tất cả các ứng viên đăng ký các chương trình đào tạo","Thuê chuyên gia tư vấn để đào tạo","Không bao giờ đổi thay nội dung chương trình đào tạo","Đào tạo tất cả nhân viên làm việc với thiết bị, vật liệu hoặc quy trình nguy hiểm."],"a":3},{"c":4,"n":30,"q":"Đào tạo về sự nhạy cảm văn hóa có nghĩa là:","o":["Đào tạo tại chỗ","Đào tạo ngôn ngữ","Tạo điều kiện cho nhân viên tiếp xúc và thích ứng với quan điểm của các nhóm văn hóa khác nhau đối với công việc","Tất cả đều sai"],"a":2},{"c":4,"n":31,"q":"Chuẩn bị cho việc đào tạo hiệu quả bao gồm:","o":["Xem trước công việc thực tế.","Xây dựng và củng cố nhận thức về nhu cầu cần được đào tạo trong tâm trí của những người tham gia","Định hướng nhân viên","Tất cả đều sai"],"a":1},{"c":4,"n":32,"q":"Trước khi đứng trước máy quay cho hội nghị truyền hình, người hướng dẫn nên:","o":["Chuẩn bị tài liệu cho người học","Xuất hiện trước khi quay","Tham gia đào tạo trên máy tính","Tất cả đều sai"],"a":0},{"c":4,"n":33,"q":"Các tổ chức thường thuê và đào tạo những nhân viên ở cấp độ mới bắt đầu (entry level) là những người:","o":["Rất thông minh","Nhiều kinh nghiệm","Có trình độ học vấn cao","Thiếu kinh nghiệm"],"a":3},{"c":4,"n":34,"q":"Trọng tâm của biểu mẫu biên bản phân tích công việc là:","o":["Các nhiệm vụ chính và nhiệm vụ phụ của công việc được liệt kê","Năng lực và các kỹ năng hoặc kiến thức cụ thể cần thiết cho mỗi nhiệm vụ chính và nhiệm vụ phụ được liệt kê","Các tiêu chuẩn thực hiện cho từng nhiệm vụ và nhiệm vụ phụ được liệt kê.","Tất cả đều sai"],"a":1},{"c":4,"n":35,"q":"Trạng thái tâm lý đối với sự khác biệt giữa những gì nhân viên mới mong đợi từ công việc mới của anh ấy/cô ấy và thực tế diễn ra được gọi là:","o":["Sự kỳ vọng","Sự xã hội hóa","Cú sốc thực tế (reality shock)","Tất cả đều sai"],"a":2},{"c":4,"n":36,"q":"“Hệ thống quản lý học tập” (learning management system) được định nghĩa là:","o":["Các công cụ hỗ trợ người học","Tập trung vào các vấn đề hậu cần của việc quản lý học tập","Các chiến lược giáo dục","Tất cả đều sai"],"a":1},{"c":4,"n":37,"q":"Danh sách các nhiệm vụ và kỹ năng cụ thể cần có trong công việc, được sử dụng để xác định việc đào tạo cần thiết để thực hiện công việc, được tìm thấy trong:","o":["Mô tả công việc và đặc tả công việc (job descriptions and job specifications)","Hướng dẫn công việc và đào tạo tại chỗ","Tiêu chuẩn công việc và chuyên môn hóa","Các tiêu chuẩn thực hiện"],"a":0},{"c":4,"n":38,"q":"Một kỹ thuật đào tạo trong đó học viên được trình bày với các mô phỏng máy tính tích hợp và sử dụng đa phương tiện, bao gồm cả băng video, để giúp học viên học cách thực hiện công việc được gọi là:","o":["Hội nghị truyền hình","Đào tạo tại chỗ","Đào tạo dựa trên máy tính (computer-based training)","Tất cả đều sai"],"a":2},{"c":4,"n":39,"q":"Bạn đã chọn thiết kế giảng dạy cho chương trình đào tạo mới mà bạn chịu trách nhiệm. Để đảm bảo rằng chương trình đào tạo sẽ đạt được các mục tiêu của nó, điều quan trọng là phải thực hiện những điều sau trước khi triển khai chương trình trên toàn công ty:","o":["Quyết định xem đào tạo dựa trên máy tính có phù hợp hay không","Tiến hành phân tích công việc","Thực hiện một nghiên cứu thí điểm với một nhóm nhỏ nhân viên và đánh giá kết quả","Thực hiện đánh giá nhu cầu"],"a":2},{"c":4,"n":40,"q":"Quá trình giúp truyền đạt cho tất cả nhân viên nh thành","Tất cả các ý trên đều đúng"],"a":3},{"c":5,"n":52,"q":"Đánh giá năng lực của nhân viên chủ yếu nhằm phục vụ mục đích?","o":["Đề bạt","Bổ nhiệm","Thăng tiến","Tất cả các mục đích trên"],"a":3},{"c":5,"n":53,"q":"Tiêu chí nào sau đây được sử dụng để đánh giá kiến thức chuyên môn của người lao động?","o":["Học hỏi kinh nghiệm, nhận ra những vấn đề tiềm năng và giải quyết khó khăn","Phán đoán và giải quyết những trục trặc kỹ thuật trong phạm vi chức năng đơn vị mình","Đưa ra sáng kiến kinh doanh đáp ứng những thách thức của môi trường cạnh tranh","Có khả năng nhân nhiệm vụ mới và đạt được mục tiêu đề ra"],"a":1},{"c":5,"n":54,"q":"Một số lãnh đạo có xu hướng đánh giá tất cả nhân viên quá cao hoặc quá thấp, các nhà lãnh đạo này rơi vào lỗi nào sau đây?","o":["Lỗi thiên kiến","Xu hướng thái quá","Lỗi định kiến","Tiêu chuẩn không rõ ràng"],"a":1},{"c":5,"n":55,"q":"Đánh giá kết quả thực hiện công việc chính thức được sử dụng cho mục đích nào sau đây?","o":["Hoàn thiện hệ thống quản trị nguồn nhân lực của doanh nghiệp","Phát triển nhân viên thông qua việc giúp tổ chức xác định người lao động nào cần được đào tạo, đào tạo ở lĩnh vực nào để phát huy tối đa tiềm năng của bản thân và đóng góp hiệu quả nhất cho doanh nghiệp","Kích thích, động viên nhân viên phát triển nhận thức về trách nhiệm, thúc đẩy nỗ lực thực hiện công việc tốt hơn","Tất cả các ý trên"],"a":3},{"c":5,"n":56,"q":"Ý nào sau đây không phải là mục đích đánh giá kết quả thực hiện công việc của nhân viên?","o":["Cung cấp thông tin phản hồi cho nhân viên biết về mức độ thực hiện công việc của họ","Kích thích nhân viên tham gia xây dựng chiến lược kinh doanh của công ty","Tuân thủ quy định của pháp luật là cơ sở khách quan, công bằng cho việc thăng cấp, khen thưởng hoặc kỷ luật","Truyền thông giao tiếp làm cơ sở cho những cuộc thảo luận giữa cấp trên và cấp dưới về vấn đề liên quan đến công việc"],"a":1},{"c":5,"n":57,"q":"Điều quan trọng trong đánh giá thực hiện công việc là gì?","o":["Vạch ra các phương hướng, cách thức cải tiến thực hiện công việc, đề ra các chỉ tiêu mới cho nhân viên","Tìm hiểu xem nhân viên cần những hỗ trợ nào từ phía công ty và nhân viên có các chương trình hành động trong từng khoảng thời gian nhất định chưa","Câu A và Câu B đúng","Không có câu nào đúng"],"a":2},{"c":5,"n":58,"q":"Trong những doanh nghiệp có quy mô lao động lớn, công việc đa dạng thì khó sử dụng phương pháp đánh giá nào sau đây?","o":["Phương pháp bảng điểm","Phương pháp xếp hạng luân phiên","Phương pháp quản trị theo mục tiêu","Phương pháp lưu trữ"],"a":1},{"c":5,"n":59,"q":"Những tiêu chí nào sau đây được sử dụng để đánh giá năng lực của nhân viên?","o":["Kiến thức chuyên môn","Quản lý công việc","Tính sáng tạo","Cả 3 đáp án trên đều đúng"],"a":3},{"c":5,"n":60,"q":"Tiêu chuẩn không rõ ràng sẽ dẫn đến những vấn đề gì khi đánh giá?","o":["Nhân viên không biết họ cần có những kỹ năng nào và thực hiện công việc như thế nào để đạt được loại giỏi hay khá.","Đôi khi cả người đánh giá và nhân viên đều không hiểu chính xác về cách thức phân loại, dẫn đến nhân viên không có động lực để phấn đấu.","Xuất hiện tình trạng cùng mức độ thực hiện công việc, nhân viên ở bộ phận này được đánh giá xuất sắc, nhân viên ở bộ phận khác bị đánh giá trung bình.","Tất cả các ý trên."],"a":3},{"c":5,"n":61,"q":"Đánh giá nhân viên cần tuân thủ những nguyên tắc cơ bản nào sau đây?","o":["Tiêu chuẩn đánh giá rõ ràng, hợp lý và có thể đo lường được","Phương thức, quy trình đánh giá phải đơn giản, được phổ biến công khai, cụ thể","Người thực hiện đánh giá phải có nhân thức đúng về vai trò, ý nghĩa của đánh giá và công bằng, khách quan, trung thực","Tất cả các nguyên tắc trên đều cần thiết"],"a":3},{"c":5,"n":62,"q":"Lãnh đạo cần phải làm gì để nâng cao hiệu quả đánh giá kết quả thực hiện công việc?","o":["Làm cho nhân viên tin rằng kết quả thực hiện công việc là công bằng và khuyến khích họ tích cực tham gia vào quá trình đánh giá","Nếu nhân viên thực hiện tốt công việc, cần đưa ra những nhận xét, đánh giá mang tính khuyến khích họ phấn đấu nhiều hơn; ngược lại, nếu nhân viên làm chưa tốt, cần hướng dẫn cho nhân viên biết cách thức sửa chữa những khuyết điểm trong công việc","Thực hiện đánh giá kết quả thực hiện công việc nên thực hiện trên cơ sở so sánh kết quả đạt được với mục tiêu đăng ký cá nhân. Các mục tiêu cá nhân xác định rõ mục tiêu cần đạt được, các hoạt động cần thực hiện","Lãnh đạo cần thực hiện tất cả các nội dung trên"],"a":3},{"c":5,"n":63,"q":"Kết quả đánh giá hoàn thành mục tiêu của tập thể và kết quả đánh giá hoàn thành nhiệm vụ của cá nhân thể hiện ở mối quan hệ nào sau đây?","o":["Tạo sự công bằng giữa các bộ phận, tránh tình trạng nhiều cán bộ quản lý muốn “nương tay” với cấp dưới, ngược lại, một số cán bộ quản lý lại quá khắt khe với cấp dưới","Khuyến khích tất cả các thành viên quan tâm đến kết quả cuối cùng của tập thể","Khuyến khích tất cả các thành viên có tinh thần làm việc đồng đội, chia sẻ, giúp đỡ nhau","Tất cả các mối quan hệ trên"],"a":3},{"c":5,"n":64,"q":"Hình thức phỏng vấn “thỏa mãn - thăng tiến” nên được sử dụng ở tình huống nào sau đây?","o":["Áp dụng đối với những nhân viên đã hoàn thành tốt công việc hiện tại nhưng không có khả năng và điều kiện thăng tiến","Sử dụng đối với những nhân viên có tiềm năng, thường được đánh giá là có mức độ thực hiện công việc tốt.","Áp dụng đối với những nhân viên không đáp ứng được các tiêu chuẩn trong thực hiện công việc","Không có tình huống nào phù hợp"],"a":1},{"c":5,"n":65,"q":"Nhà lãnh đạo không có khả năng thực hiện tốt nhiệm vụ đánh giá kết quả thực hiện công việc của nhân viên thường liên quan đến những vấn đề nào sau đây?","o":["Không có khả năng phê bình","Không có khả năng cung cấp thông tin phản hồi","Không biết cách phê phán các sự việc, vấn đề cụ thể","Liên quan đến tất cả các vấn đề trên"],"a":3},{"c":6,"n":1,"q":"Quang được trả mức lương 40.000 USD/năm với tiềm năng kiếm thêm tiền nếu đáp ứng được một số mục tiêu hiệu suất nhất định. Tại sao đây là một ví dụ về đãi ngộ tài chính ","Đào tạo an toàn cho người lao động","Triển khai quy trình an toàn tại nơi làm việc","Phát triển và triển khai những chính sách an toàn"],"a":3},{"c":7,"n":8,"q":"Quyền lợi theo hợp đồng (contractual rights) được hiểu là:","o":["Nhiệm vụ cụ thể trong công việc","Những quyền lợi được ghi nhận trên hợp đồng cụ thể giữa nhân viên và người sử dụng lao động","Những quyền công dân được thừa nhận bởi nhà nước","Bản cam kết chính thức về việc sử dụng lao động"],"a":1},{"c":7,"n":9,"q":"Hùng tổ chức những hoạt động nhằm xây dựng và duy trì mối quan hệ tích cực giữa mình với nhân viên nhằm tăng năng suất và sự đoàn kết trong nhóm. Hành động của anh được xem là tác động đến điều gì?","o":["Công bằng tổ chức","Chính sách của nhà nước","Quan hệ lao động","Đạo đức kinh doanh"],"a":2},{"c":7,"n":10,"q":"Thỏa thuận không cạnh tranh (noncompete agreements) trong hợp đồng lao động thông thường được dùng để ngăn chặn:","o":["Nhân viên cũ của công ty làm việc cho đối thủ cạnh tranh trong một khoảng thời gian nhất định","Tình trạng độc quyền về sản phẩm trong thời gian nhất định","Nhân viên nghỉ việc quá sớm sau khi được đào tạo","Doanh nghiệp liên kết và sáp nhập với doanh nghiệp đối tác"],"a":0},{"c":7,"n":11,"q":"Người thuê mướn lao động hứa hẹn về sự ổn định trong công việc cho nhân viên. Lời hứa đó là một ví dụ của:","o":["Thỏa thuận không cạnh tranh (noncompete agreements)","Bảo hộ quyền sở hữu trí tuệ (intellectual property protection)","Hợp đồng không tường minh (implied contract)","Lợi thế cạnh tranh (competitive advantages)"],"a":2},{"c":7,"n":12,"q":"Hậu quả của việc đối xử không công bằng tại nơi làm việc là?","o":["Giảm căng thẳng","Tăng sự hài lòng của mọi người trong tổ chức","Tăng đoàn kết trong công ty","Giảm tinh thần làm việc"],"a":3},{"c":7,"n":13,"q":"Những thành phần chính của tính công bằng trong tổ chức (organizational justice) là?","o":["Công bằng thủ tục, công bằng phân phối và công bằng đối xử","Công bằng phân phối, đối xử bình đẳng và đối xử có đạo đức","Đối xử bình đẳng, quy trình rõ ràng và tương tác có đạo đức","Tương tác bình đẳng, đối xử có đạo đức và quy trình rõ ràng"],"a":0},{"c":7,"n":14,"q":"Tính công bằng thể hiện trong các quyết định về kết quả gọi là:","o":["Công bằng thủ tục","Công bằng đối xử","Công bằng phân phối","Công bằng cá nhân"],"a":2},{"c":7,"n":15,"q":"Công bằng phân phối được hiểu là:","o":["Sự phân định rõ hành vi nào là đúng và sai","Sự công bằng trong các quyết định về phân chia kết quả","Sự tôn trọng khi giao tiếp trong quá trình làm việc","Sự phân định rõ các hành vi đạo đức"],"a":1},{"c":7,"n":16,"q":"Tính công bằng trong triển khai các quy trình về người lao động là ví dụ của:","o":["Công bằng thủ tục","Công bằng giao tiếp","Giao tiếp phân phối","Công bằng đối xử"],"a":0},{"c":7,"n":17,"q":"Mệnh đề nào mô tả cho công bằng thủ tục?","o":["Là cách công ty kinh doanh","Là sự tôn trọng trong giao tiếp với nhân viên","Là cách nhà quản trị đối đãi với nhân viên","Là sự công bằng trong quá trình ra quyết định với người lao động"],"a":3},{"c":7,"n":18,"q":"Hợp đồng không tường minh (implied contract) là:","o":["Những thoả thuận được ghi nhận trong hợp đồng lao động","Những thỏa thuận khi xảy ra tranh chấp ở tòa án","Những thỏa thuận không được văn bản hoá","Những thoả thuận được quy định bởi pháp luật"],"a":2},{"c":7,"n":19,"q":"Những giá trị, truyền thống, hành vi được mọi người chia sẻ trong tổ chức chính là:","o":["Văn hoá tổ chức","Đạo đức tổ chức","Sứ mệnh tổ chức","Môi trường của tổ chức"],"a":0},{"c":7,"n":20,"q":"Văn hoá tổ chức được hiểu một cách toàn diện là:","o":["Niềm tin về các giá trị đúng hoặc sai trong tổ chức","Sứ mệnh tổ chức","Quy tắc xử lý các tình huống với khách hàng","Những giá trị, truyền thống, hành vi được mọi người chia sẻ trong tổ chức"],"a":3},{"c":7,"n":21,"q":"Quá trình tuyển chọn được xem là không công bằng nếu:","o":["Người tuyển chọn chỉ chú ý đến các vấn đề cá nhân","Phỏng vấn được thực hiện qua giao tiếp hai chiều","Khuyến khích các phản hồi trực tiếp từ ứng let sel=new Set(D.chapters.map((_,i)=>i)),cfg={n:20,t:30,timer:true,shuf:true},list=[],idx=0,ans={},tmr=null,left=0;

<section class="box"><h2>3. Thời gian mỗi câu</h2><div class="sl"><input type="range" id="rt" min="5" max="120" step="5" value="${cfg.t}"><b class="mono" id="vt">${cfg.t}s</b><span>giây / câu</span></div>

  document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(sel.has(i)){if(sel.size>1)sel.delete(i)}else sel.add(i);setup()});

  }
  const q=list[idx],k=key(q),a=ans[k],has=a!==undefined,T=cfg.timer?cfg.t:0;
  m.innerHTML=head('Câu '+(idx+1)+' / '+list.length+' · '+D.chapters[q.c].split(':')[0])+`<div class="box">${T>0&&!has?`<div class="timer mono" id="tl">⏱ ${T}s</div>`:''}<p class="q">${esc(q.q)}</p>${q.o.map((t,i)=>{let c='';if(has){if(i===q.a)c=' ok';else if(i===a)c=' no'}return `<button class="opt${c}" data-i="${i}"${has?' disabled':''}><b>${has&&i===q.a?'✓':has&&i===a?'✗':L[i]}</b><span>${esc(t)}</span></button>`}).join('')}<div class="res ${has?(a===q.a?'ok':'no'):''}">${has?(a===q.a?'✓ Chính xác!':(a===-1?'⏰ Hết giờ! ':'✗ Sai rồi. ')+'Đáp án đúng là '+L[q.a]+'.'):''}</div></div><div class="nav"><button class="nv" id="prev"${idx?'':' disabled'}>← Câu trước</button><button class="nv p" id="next">${idx===list.length-1?'Xem kết quả':'Câu sau →'}</button></div>`;
  $('bk').onclick=setup;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[k]=+b.dataset.i;render()});
  if(T>0&&!has){left=T;tmr=setInterval(()=>{left--;const e=$('tl');if(e){e.textContent='⏱ '+left+'s';e.classList.toggle('low',left<=5)}if(left<=0){clearInterval(tmr);ans[k]=-1;render()}},1000)}
  $('prev').onclick=()=>{idx--;render();scrollTo(0,0)};
  $('next').onclick=()=>{idx++;render();scrollTo(0,0)};
}
setup();
</script>
</body>
</html>
